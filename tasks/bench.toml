# Telemetry performance benchmarks.
#
# These cover the log export path, where observability cost is charged to the
# workload being observed: a sandbox renders every security event inline before
# the line is queued, every sandbox's lines then converge on one gateway, and
# the gateway converts and ships them as OTLP log records. Run them before
# changing anything on that path.

[bench]
description = "Run all telemetry benchmarks (OCSF event rendering, gateway log fan-in, OTLP log export)"
depends = ["bench:ocsf", "bench:gateway", "bench:export"]

["bench:ocsf"]
description = "Sandbox hot path: cost of rendering an OCSF event per emission"
run = "cargo bench -p openshell-ocsf --bench event_rendering"

["bench:gateway"]
description = "Gateway log fan-in: per-line publish cost and scaling across concurrent sandboxes"
run = "cargo bench -p openshell-server --bench log_fanin"

["bench:export"]
description = "Gateway OTLP log export: record conversion cost and worker drain rate by payload shape"
run = "cargo bench -p openshell-server --bench log_export"

["bench:quick"]
description = "Same benchmarks with short sampling, for a fast signal while iterating"
run = """
cargo bench -p openshell-ocsf --bench event_rendering -- --warm-up-time 1 --measurement-time 3
cargo bench -p openshell-server --bench log_fanin -- --warm-up-time 1 --measurement-time 3
cargo bench -p openshell-server --bench log_export -- --warm-up-time 1 --measurement-time 3
"""

["bench:baseline"]
description = "Record the current numbers as the comparison baseline for later runs"
run = """
cargo bench -p openshell-ocsf --bench event_rendering -- --save-baseline main
cargo bench -p openshell-server --bench log_fanin -- --save-baseline main
cargo bench -p openshell-server --bench log_export -- --save-baseline main
"""

["bench:compare"]
description = "Compare working-tree performance against the saved baseline"
run = """
cargo bench -p openshell-ocsf --bench event_rendering -- --baseline main
cargo bench -p openshell-server --bench log_fanin -- --baseline main
cargo bench -p openshell-server --bench log_export -- --baseline main
"""
