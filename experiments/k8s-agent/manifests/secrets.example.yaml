# Template only — do not commit real values, and do not `kubectl apply` this
# file as-is. Create the Secret from the environment instead:
#
#   kubectl -n openshell-experiments create secret generic repo-watcher-credentials \
#     --from-literal=GITHUB_TOKEN="$GITHUB_TOKEN" \
#     --from-literal=SLACK_BOT_TOKEN="$SLACK_BOT_TOKEN" \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
#
# For the OAuth variant, supply CLAUDE_CODE_OAUTH_TOKEN instead of
# ANTHROPIC_API_KEY. Setting both is rejected by the launcher and by the
# harness adapter, so billing attribution stays unambiguous.
#
# In a real deployment these values should come from External Secrets or the
# 1Password operator — both are already installed on this cluster — rather than
# from an operator's shell.
apiVersion: v1
kind: Secret
metadata:
  name: repo-watcher-credentials
  namespace: openshell-experiments
type: Opaque
stringData:
  # GitHub token scoped to the single watched repository. The provider profile
  # narrows it further on the wire, but scope the token too — defence in depth.
  GITHUB_TOKEN: "REPLACE_ME"
  # Slack bot token. Required scopes are read-only:
  #   channels:history, groups:history, channels:read, users:read
  SLACK_BOT_TOKEN: "REPLACE_ME"
  # Exactly one of the following.
  ANTHROPIC_API_KEY: "REPLACE_ME"
  # CLAUDE_CODE_OAUTH_TOKEN: "REPLACE_ME"
