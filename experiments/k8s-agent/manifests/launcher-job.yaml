# SPDX-License-Identifier: Apache-2.0

# Deploys the repo-watcher agent onto the in-cluster gateway.
#
# The Job is the deployment action, not the agent. It talks to the gateway,
# registers provider profiles and credentials, and creates the sandbox with the
# supervisor as its main process. Then it exits. The agent keeps running as a
# sandbox pod managed by the Agent Sandbox controller, so the Job's lifetime and
# the agent's are unrelated.
#
# Re-running this Job is the redeploy path. It is idempotent: profiles are
# updated in place and providers upserted. Set RECREATE=1 to replace a running
# agent rather than leave it alone.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: repo-watcher-launcher
  namespace: openshell-experiments
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-watcher-agent-def
  namespace: openshell-experiments
data:
  # Populated by:
  #   kubectl -n openshell-experiments create configmap repo-watcher-agent-def \
  #     --from-file=experiments/k8s-agent/agent/policy.yaml \
  #     --from-file=experiments/k8s-agent/agent/providers/ \
  #     --dry-run=client -o yaml | kubectl apply -f -
  #
  # Only the policy and provider profiles are needed here. The prompt and
  # watch-config are baked into the agent image, not mounted, so a running
  # agent's instructions cannot be edited out from under it.
  placeholder: "run the create-configmap step in the runbook"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: repo-watcher-deploy
  namespace: openshell-experiments
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: repo-watcher-launcher
    spec:
      serviceAccountName: repo-watcher-launcher
      restartPolicy: Never
      containers:
        - name: launcher
          # Built from experiments/k8s-agent/launcher/Dockerfile.
          image: openshell-agents/repo-watcher-launcher:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/work/scripts/deploy-agent.sh"]
          env:
            # In-cluster gateway address. TLS is disabled on this deployment,
            # so the CLI is pointed straight at the Service.
            - name: OPENSHELL_GATEWAY_ENDPOINT
              value: "http://openshell.openshell-experiments.svc.cluster.local:8080"
            - name: OPENSHELL_GATEWAY
              value: "in-cluster"
            - name: IMAGE_REF
              value: "openshell-agents/repo-watcher:dev"
            - name: SANDBOX_NAME
              value: "repo-watcher"
            - name: RUN_MODE
              value: "watch"
            - name: POLL_INTERVAL_SECONDS
              value: "900"
            - name: RECREATE
              value: "0"
          envFrom:
            # GITHUB_TOKEN, SLACK_BOT_TOKEN, and exactly one Claude credential.
            # The CLI's `--credential KEY` form reads these from the
            # environment, so no secret reaches a command line.
            - secretRef:
                name: repo-watcher-credentials
          volumeMounts:
            - name: agent-def
              mountPath: /work/agent/providers
            - name: scripts
              mountPath: /work/scripts
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: agent-def
          configMap:
            name: repo-watcher-agent-def
        - name: scripts
          configMap:
            name: repo-watcher-scripts
            defaultMode: 0755
