# DUMMY CREDENTIALS — for local kind bring-up only.
#
# These are deliberately non-functional placeholders. With them the agent
# deploys, starts, and enforces policy, and every outbound call is refused by
# the upstream API rather than by the sandbox. That is enough to verify wiring,
# policy, and the watch loop; it is not enough to triage a real alert.
#
# Replacing these with real values: see "Supplying Real Credentials" in
# experiments/k8s-agent/README.md. Do not edit real secrets into this file —
# it is committed.

credentials:
  create: true
  githubToken: "ghp_DUMMY000000000000000000000000000000"
  slackBotToken: "xoxb-DUMMY-000000000000-000000000000"
  # The agent's own Grafana token. Read from the sandbox environment by the
  # in-sandbox MCP server as a placeholder, substituted by the proxy.
  grafanaServiceAccountToken: "glsa_DUMMY0000000000000000000000000000"
  anthropicApiKey: "sk-ant-DUMMY0000000000000000000000000000"
