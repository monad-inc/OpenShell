{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- if .Values.createSecret }}
{{- if not .Values.registry.username }}
{{- fail "registry.username is required (your GitHub username)" }}
{{- end }}
{{- if not .Values.registry.password }}
{{- fail "registry.password is required — pass it at install time, e.g. --set registry.password=\"$GITHUB_TOKEN\"" }}
{{- end }}
{{- $auth := printf "%s:%s" .Values.registry.username .Values.registry.password | b64enc }}
{{- $entry := dict "username" .Values.registry.username "password" .Values.registry.password "auth" $auth }}
{{- if .Values.registry.email }}
{{- $_ := set $entry "email" .Values.registry.email }}
{{- end }}
{{- $config := dict "auths" (dict .Values.registry.server $entry) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $config | toJson | b64enc }}
{{- end }}
