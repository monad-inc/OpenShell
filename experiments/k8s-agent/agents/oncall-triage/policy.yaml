# Sandbox policy for the on-call triage agent.
#
# Division of responsibility:
#   * filesystem_policy / process    — what the agent can touch locally.
#   * provider profiles              — all egress, because all of it is
#                                      credentialed: GitHub, Slack, Claude, and
#                                      Grafana-via-MCP.
#
# Grafana is reached through MCP rather than REST. The MCP server holds no
# credential; this agent's own service-account token is injected into each
# request by the proxy, exactly as for every other provider. Because MCP is on
# the wire, the profile authorizes individual tool names rather than URL paths.
version: 1

filesystem_policy:
  include_workdir: true
  # /etc/openshell holds the immutable agent payload (prompt, skills, config,
  # mcp.json). Read-only here is what stops the agent rewriting its own
  # instructions or pointing itself at a different MCP server.
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

# Empty on purpose: every egress this agent has is credentialed, so it belongs
# to a provider profile. Grafana included — it is reached through the MCP server
# with this agent's own token injected per request, which makes it an ordinary
# provider rather than a special case.
network_policies: {}
