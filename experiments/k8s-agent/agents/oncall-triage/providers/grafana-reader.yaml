# Read-only Grafana access for the on-call triage agent.
#
# "Read-only" cannot be expressed as "deny POST" here, and that is the whole
# subtlety of this profile. Grafana's primary data-reading endpoint is
# `POST /api/ds/query` — the query is a JSON body, so it must be a POST even
# though it only reads. Method alone is therefore not a safety boundary.
#
# What makes this read-only is the *path allowlist*: every rule below names an
# endpoint that observes. Nothing mutating is listed, so dashboard writes
# (POST /api/dashboards/db), annotation creation, alert-rule edits, datasource
# changes, user/org administration, and every DELETE are refused by the proxy
# because no rule permits them.
id: grafana-reader
display_name: Grafana (read-only)
description: Read-only Grafana access for alert investigation — dashboards, datasource queries, alert state
# `observability` is not a supported category — the gateway rejects the import
# with "unsupported provider profile category". The accepted set includes
# agent, data, inference, messaging, other, and source_control; Grafana is a
# telemetry data source, so `data` is the closest fit.
category: data
credentials:
  - name: api_token
    description: Grafana service account token with Viewer role
    env_vars: [GRAFANA_API_KEY, GRAFANA_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_token]
endpoints:
  # Points at the kube-prometheus-stack Grafana already running in this
  # cluster, which makes the local bring-up realistic and the policy probes
  # meaningful: the host resolves, so a refused connection is a genuine policy
  # decision rather than a DNS failure. Change host/port for a real instance.
  - host: kube-prometheus-stack-grafana.grafana.svc.cluster.local
    port: 80
    protocol: rest
    enforcement: enforce
    rules:
      # Identity / reachability preflight.
      - allow: { method: GET, path: "/api/health" }
      - allow: { method: GET, path: "/api/org" }
      - allow: { method: GET, path: "/api/user" }

      # Find dashboards and read their panel definitions, so the agent can
      # learn which queries the humans already consider meaningful.
      - allow: { method: GET, path: "/api/search" }
      - allow: { method: GET, path: "/api/dashboards/uid/**" }
      - allow: { method: GET, path: "/api/folders" }
      - allow: { method: GET, path: "/api/folders/**" }

      # Datasource discovery.
      - allow: { method: GET, path: "/api/datasources" }
      - allow: { method: GET, path: "/api/datasources/uid/**" }

      # The main read path. POST is required by the API shape, not by intent:
      # the PromQL/LogQL query travels in the request body.
      - allow: { method: POST, path: "/api/ds/query" }

      # Datasource proxy — how Loki and Prometheus are actually queried.
      # Prometheus range queries accept either verb depending on query length.
      - allow: { method: GET, path: "/api/datasources/proxy/**" }
      - allow: { method: POST, path: "/api/datasources/proxy/**" }

      # Alert state: what is firing now, and the rules behind it.
      - allow: { method: GET, path: "/api/alertmanager/grafana/api/v2/alerts" }
      - allow: { method: GET, path: "/api/alertmanager/grafana/api/v2/alerts/groups" }
      - allow: { method: GET, path: "/api/v1/rules" }
      - allow: { method: GET, path: "/api/ruler/grafana/api/v1/rules" }
      - allow: { method: GET, path: "/api/v1/provisioning/alert-rules" }
      - allow: { method: GET, path: "/api/v1/provisioning/alert-rules/**" }

      # Deploy markers and incident context already recorded by humans.
      # GET only: the agent reads annotations and never writes one.
      - allow: { method: GET, path: "/api/annotations" }
      - allow: { method: GET, path: "/api/annotations/tags" }
binaries: [/usr/bin/curl, /usr/local/bin/curl]
