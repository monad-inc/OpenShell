# SPDX-License-Identifier: Apache-2.0

# Grafana, reached through the Grafana MCP server — as an ordinary OpenShell
# provider.
#
# The MCP server holds no credential. It is a stateless protocol translator:
# the agent's own Grafana service-account token travels on each request in the
# X-Grafana-Service-Account-Token header, which mcp-grafana reads per request.
#
# That restores the normal provider model. The agent receives a placeholder, the
# proxy substitutes the real token on the wire, and the credential is tied to
# this agent rather than ambient in a shared service. Two agents mean two
# tokens, two scopes, and two identities in Grafana's audit log. An
# uncredentialed caller reaching the MCP server gets nothing, because there is
# nothing there to borrow.
#
# ---------------------------------------------------------------------------
# KNOWN LIMIT — credential redirection.
#
# mcp-grafana lets a request override the server's configured Grafana URL with
# an X-Grafana-URL header, and the header wins over the server's own env var.
# Verified directly: a server pinned to GRAFANA_URL=http://pinned-by-env.invalid
# dialed attacker-supplied.invalid when asked to.
#
# That matters because credential injection is only as safe as a fixed
# destination. An agent that could craft its own request to this endpoint could
# set X-Grafana-URL to a host it controls; the proxy would inject the real
# token, and the MCP server would forward it there.
#
# Two controls, in order of how much they are worth:
#
#   1. `binaries` below. Only the Claude Code binary may speak to this
#      endpoint, and its MCP client config is baked read-only into the payload
#      and loaded with --strict-mcp-config, so it sends exactly the headers
#      declared there and no others. This is enforced by the OpenShell
#      supervisor and works on any cluster.
#   2. An egress NetworkPolicy confining the MCP server to Grafana
#      (chart template grafana-mcp-netpol.yaml). This closes the redirect
#      outright — but only on a cluster whose CNI enforces NetworkPolicy.
#      kind's default kindnetd does NOT, so on the local cluster control 1 is
#      the one actually doing the work.
# ---------------------------------------------------------------------------
id: grafana-mcp
display_name: Grafana (via MCP)
description: Grafana MCP access with a per-agent service-account token injected per request
category: data
credentials:
  - name: service_account_token
    description: Grafana service account token (Viewer) belonging to this agent
    env_vars: [GRAFANA_SERVICE_ACCOUNT_TOKEN]
    required: true
    auth_style: header
    header_name: X-Grafana-Service-Account-Token
discovery:
  credentials: [service_account_token]
endpoints:
  - host: grafana-mcp.openshell-experiments.svc.cluster.local
    port: 8000
    path: /mcp
    protocol: mcp
    enforcement: enforce
    # An in-namespace Service resolves into RFC 1918 space, which policy
    # otherwise treats as an SSRF risk.
    allowed_ips: ["10.0.0.0/8"]
    mcp:
      # Note: the provider-profile schema accepts a narrower mcp block than the
      # sandbox-policy schema — max_body_bytes is rejected here as an unknown
      # field, though sandbox policy takes it.
      #
      # Omitting versions pins one default revision that excludes 2025-03-26 —
      # what an HTTP client implies with no MCP-Protocol-Version header — and
      # every tools/call is then refused with a message that reads like a
      # broken tool matcher.
      versions: ["2025-03-26", "2025-06-18", "2025-11-25"]
    rules:
      - allow: { method: initialize }
      - allow: { method: notifications/initialized }
      - allow: { method: tools/list }
      - allow:
          method: tools/call
          tool:
            any:
              - search_dashboards
              - get_dashboard_by_uid
              - get_dashboard_panel_queries
              - get_dashboard_summary
              - get_dashboard_property
              - list_datasources
              - get_datasource
              - query_prometheus
              - list_prometheus_metric_names
              - list_prometheus_metric_metadata
              - list_prometheus_label_names
              - list_prometheus_label_values
              - query_loki_logs
              - query_loki_stats
              - query_loki_patterns
              - list_loki_label_names
              - list_loki_label_values
              - list_alert_groups
              - get_alert_group
              - get_annotations
              - get_annotation_tags
              - list_incidents
              - get_incident
              - get_current_oncall_users
              - find_error_pattern_logs
              - find_slow_requests
    deny_rules:
      # Redundant against the allowlist and kept deliberately.
      #
      # grafana_api_request proxies an arbitrary Grafana API call, so
      # permitting it would make every tool name above decorative. Naming it
      # means widening the allowlist later cannot quietly re-admit it.
      - method: tools/call
        tool: grafana_api_request
      - method: tools/call
        tool: update_dashboard
# Only the Claude Code binary. curl is deliberately absent: see KNOWN LIMIT.
binaries:
  - /usr/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe
  - /usr/bin/claude
  - /usr/local/bin/claude
