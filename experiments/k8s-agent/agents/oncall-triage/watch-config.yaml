# Declarative scope for the on-call triage agent.
#
# Baked into the immutable agent payload at
# /etc/openshell/agent-payload/watch-config.yaml. Changing what this agent
# watches means editing this file and rebuilding — the running agent cannot
# widen its own scope.
#
# This file states INTENT. Enforcement lives in providers/*.yaml. Keep them in
# agreement: pointing `github.org` at a different org here without changing
# github-triage.yaml produces an agent that tries and is refused at the proxy.

version: 1

slack:
  # Channels the agent reads alerts from. Read-only in practice: the agent is
  # told to post only to report_channel, and nothing here writes.
  # C07S7CXTTJ7 = #alerts-production
  alert_channels:
    - C07S7CXTTJ7

  # Where the agent announces what it did. This channel is also the agent's
  # memory: there is no state issue and no other store, so each cycle reads its
  # own prior announcements here to know which alerts it has already handled.
  # Every announcement carries an `alert-key:` line for exactly that purpose.
  # C0C6777N7SP = #triage-bot-test
  report_channel: C0C6777N7SP

  # Alerts arrive as Slack *attachments* with an empty top-level `text`, so
  # matching the message text finds nothing. Match the attachment title or
  # fallback instead. Verified against the live channel: every alert has
  # text_len=0 and an attachments[0].title like
  #   "[FIRING:1] [Logs] High Error Rate (api alerts warning)"
  #   "[RESOLVED] KubeHpaMaxedOut production beta (...)"
  alert_match:
    fields: [attachments.title, attachments.fallback]
    firing_patterns:
      - "\\[FIRING"
    resolved_patterns:
      - "\\[RESOLVED\\]"

  # Messages from these Slack bot ids are alerts. B07RKQWD00H is the Grafana
  # alerting integration posting into #alerts-production. These are `bot_id`
  # values, not user ids — the alert messages carry no `user`.
  alert_bot_ids:
    - B07RKQWD00H

  # On a cold start with no prior announcement to anchor to, look back no
  # further than this.
  cold_start_lookback_seconds: 3600

grafana:
  # Reached through the `grafana` MCP server, which runs as a stdio subprocess
  # inside this sandbox. Call its tools rather than constructing Grafana URLs.
  # Which instance it points at is set by GRAFANA_URL in the mcp_servers block
  # of agent.yaml; what may be reached is set by providers/grafana.yaml.
  via: mcp
  mcp_server: grafana
  # Window queried around an alert's firing time.
  lookback_seconds: 3600
  # Datasource UIDs the agent should prefer. Empty means discover via /api/datasources.
  datasource_uids: []

github:
  # Org the agent may read. Enforced by github-triage.yaml.
  org: monad-inc
  # Repositories in triage scope. The agent will not clone outside this list
  # even though the profile permits the whole org, so that widening scope is a
  # reviewable config change rather than an accident.
  # The agent will not clone outside this list even though the provider profile
  # permits the whole org, so widening scope stays a reviewable config change.
  repos:
    - monad-inc/infra
    - monad-inc/fleet-infra
    - monad-inc/helm
    - monad-inc/inputs
    - monad-inc/outputs
    - monad-inc/enrichments
    - monad-inc/transforms
    - monad-inc/core
  base_branch: main
  branch_prefix: oncall/
  # No state issue, deliberately. The agent writes no tracking state anywhere:
  # its announcements in slack.report_channel are the only record, and the
  # `alert-key:` line in each one is what the next cycle reads to avoid
  # re-triaging the same alert.

triage:
  # Investigations per cycle. Triage depth beats breadth: one alert understood
  # is worth more than five skimmed.
  max_investigations_per_cycle: 1
  # A PR is only opened when the agent can point at a specific line or commit
  # as the cause. Anything less is reported as findings, not code.
  open_pr_only_with_identified_cause: true
  max_prs_per_cycle: 1
  # Alerts matching these are acknowledged as known-noisy and skipped.
  suppress_patterns: []
