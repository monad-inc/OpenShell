# SPDX-License-Identifier: Apache-2.0

id: oncall-triage
payload_version: 1
display_name: On-Call Triage Agent
description: Watch production alert channels, investigate alerts in Grafana, trace causes in code, and open a PR when the cause is identified.

sandbox:
  name_prefix: oncall
  from: agent://.
  gateway: kind-experiments
  background_log_dir: logs

harness:
  default: claude
  supported:
    claude:
      model: claude-opus-5

runtime:
  mode: watch
  # Alerts are time-sensitive in a way that code review is not. Five minutes
  # keeps the agent responsive without hammering Slack or the model API.
  poll_interval_seconds: 300
  max_transient_failures: 5

profile_paths:
  - providers

settings:
  - key: providers_v2_enabled
    value: true

providers:
  - id: github-triage
    name: github-triage
    profile: github-triage
    credential_mode: explicit
    credentials:
      - env: GITHUB_TOKEN
        source:
          kind: host_command
          command: printenv GITHUB_TOKEN
        export: true

  # Grafana through MCP. The MCP server holds no credential; this token is
  # injected per request, so it is scoped and attributable to this agent.
  - id: grafana-mcp
    name: grafana-mcp
    profile: grafana-mcp
    credential_mode: explicit
    credentials:
      - env: GRAFANA_SERVICE_ACCOUNT_TOKEN
        source:
          kind: host_command
          command: printenv GRAFANA_SERVICE_ACCOUNT_TOKEN
        export: true

  - id: slack-oncall-reader
    name: slack-oncall-reader
    profile: slack-oncall-reader
    credential_mode: explicit
    credentials:
      - env: SLACK_BOT_TOKEN
        source:
          kind: host_command
          command: printenv SLACK_BOT_TOKEN
        export: true

  # Claude Code, API-key billing. Setting CLAUDE_CODE_OAUTH_TOKEN instead swaps
  # this for the claude-code-oauth profile; setting both is refused.
  - id: claude-code-apikey
    name: claude-code-apikey
    profile: claude-code-apikey
    harness: claude
    credential_mode: explicit
    credentials:
      - env: ANTHROPIC_API_KEY
        source:
          kind: host_command
          command: printenv ANTHROPIC_API_KEY
        export: true

skills:
  - id: alert-triage
    source: agent://skills/alert-triage/SKILL.md
    destination: skills/alert-triage/SKILL.md
  - id: grafana-investigation
    source: agent://skills/grafana-investigation/SKILL.md
    destination: skills/grafana-investigation/SKILL.md
  - id: root-cause-analysis
    source: agent://skills/root-cause-analysis/SKILL.md
    destination: skills/root-cause-analysis/SKILL.md

resources:
  # MCP client config for the Claude Code harness. Baked into the read-only
  # payload so the agent cannot repoint itself at a different MCP server.
  - id: mcp-config
    source: agent://mcp.json
    destination: mcp.json

  - id: watch-config
    source: agent://watch-config.yaml
    destination: watch-config.yaml

prompt_template: prompts/oncall.md
