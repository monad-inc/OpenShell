id: oncall-triage
payload_version: 1
display_name: On-Call Triage Agent
description: Watch production alert channels, investigate alerts in Grafana, trace causes in code, and open a PR when the cause is identified.

sandbox:
  name_prefix: oncall
  from: agent://.
  gateway: kind-experiments
  background_log_dir: logs

harness:
  default: claude
  supported:
    claude:
      model: claude-opus-5

runtime:
  mode: watch
  # Alerts are time-sensitive in a way that code review is not. Five minutes
  # keeps the agent responsive without hammering Slack or the model API.
  poll_interval_seconds: 300
  max_transient_failures: 5

profile_paths:
  - providers

settings:
  - key: providers_v2_enabled
    value: true

providers:
  - id: github-triage
    name: github-triage
    profile: github-triage
    credential_mode: explicit
    credentials:
      - env: GITHUB_TOKEN
        source:
          kind: host_command
          command: printenv GITHUB_TOKEN
        export: true

  # Grafana. The MCP server runs as a stdio subprocess inside this sandbox
  # (see mcp_servers below), so what crosses the sandbox boundary is ordinary
  # HTTPS to Grafana — which makes this an ordinary provider.
  - id: grafana
    name: grafana
    profile: grafana
    credential_mode: explicit
    credentials:
      - env: GRAFANA_SERVICE_ACCOUNT_TOKEN
        source:
          kind: host_command
          command: printenv GRAFANA_SERVICE_ACCOUNT_TOKEN
        export: true

  - id: slack-oncall-reader
    name: slack-oncall-reader
    profile: slack-oncall-reader
    credential_mode: explicit
    credentials:
      - env: SLACK_BOT_TOKEN
        source:
          kind: host_command
          command: printenv SLACK_BOT_TOKEN
        export: true

  # Claude Code, API-key billing. Setting CLAUDE_CODE_OAUTH_TOKEN instead swaps
  # this for the claude-code-oauth profile; setting both is refused.
  - id: claude-code-apikey
    name: claude-code-apikey
    profile: claude-code-apikey
    harness: claude
    credential_mode: explicit
    credentials:
      - env: ANTHROPIC_API_KEY
        source:
          kind: host_command
          command: printenv ANTHROPIC_API_KEY
        export: true

# MCP servers available to this agent.
#
# Each entry does two things: it tells the image build how to get the server's
# binary into the sandbox, and it generates the Claude Code MCP client config
# baked into the read-only payload. Adding an MCP server to an agent is this
# block and nothing else — no chart change, no extra service.
#
# These run over stdio inside the sandbox, so MCP frames never cross the
# sandbox boundary. What OpenShell sees and enforces is the HTTP the server
# makes to its upstream, governed by that upstream's provider profile. The
# credential reaches the server as a placeholder in its environment and is
# substituted by the proxy on the wire, so the binary never holds it.
mcp_servers:
  - id: grafana
    install:
      # Copies a binary out of a published image at build time via a
      # multi-stage COPY --from: no download step, no package manager.
      #
      # A digest would be better than a tag for reproducibility, and the digest
      # resolves fine with `docker manifest inspect`, but a by-digest pull of
      # this Docker Hub repo fails under BuildKit with
      # "insufficient_scope: authorization failed" on an anonymous pull. Pin by
      # digest once the image is mirrored to a registry you authenticate to.
      kind: oci_binary
      image: mcp/grafana:latest
      source_path: /app/mcp-grafana
      dest_path: /usr/local/bin/mcp-grafana
    command: /usr/local/bin/mcp-grafana
    args:
      # Narrow the surface at the server too, not only in policy.
      - -disable-write
      - -enabled-tools
      - search,datasource,prometheus,loki,alerting,dashboard,incident,oncall,annotations,sift
    env:
      GRAFANA_URL: http://kube-prometheus-stack-grafana.grafana.svc.cluster.local
      # Resolved by Claude Code from the sandbox environment, where it is an
      # OpenShell placeholder. mcp-grafana forwards it as
      # `Authorization: Bearer <value>` and the proxy substitutes the real
      # token — verified.
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}

skills:
  - id: alert-triage
    source: agent://skills/alert-triage/SKILL.md
    destination: skills/alert-triage/SKILL.md
  - id: grafana-investigation
    source: agent://skills/grafana-investigation/SKILL.md
    destination: skills/grafana-investigation/SKILL.md
  - id: root-cause-analysis
    source: agent://skills/root-cause-analysis/SKILL.md
    destination: skills/root-cause-analysis/SKILL.md

resources:
  - id: watch-config
    source: agent://watch-config.yaml
    destination: watch-config.yaml

prompt_template: prompts/oncall.md
