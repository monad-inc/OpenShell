# Sandbox policy for the repo-watcher agent.
#
# Division of responsibility, which is easy to get wrong:
#   * This file governs the filesystem and process surface.
#   * Network egress is governed by the attached provider profiles
#     (github-watcher, slack-reader, claude-code*). `network_policies: {}` is
#     not "allow all" — the sandbox denies egress by default, and each provider
#     opens exactly the hosts, methods, and paths it declares. A smoke-test
#     sandbox with no providers attached cannot reach the network at all.
version: 1

filesystem_policy:
  include_workdir: true
  # /etc/openshell holds the immutable agent payload (prompt, config, runtime).
  # Read-only here is what stops the agent from rewriting its own instructions
  # or widening its own declared scope mid-cycle.
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies: {}
