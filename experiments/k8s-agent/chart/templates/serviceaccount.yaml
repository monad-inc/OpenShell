{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "repo-watcher.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "repo-watcher.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- /*
    Created before the deploy hook runs. The launcher needs no Kubernetes RBAC
    at all: it talks to the OpenShell gateway over gRPC, and the gateway is what
    holds the cluster permissions to create sandbox pods.
  */}}
{{- end }}
