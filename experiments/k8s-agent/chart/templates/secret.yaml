{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- if and .Values.credentials.create (not .Values.credentials.existingSecret) }}
{{- if and .Values.credentials.anthropicApiKey .Values.credentials.claudeCodeOauthToken }}
{{- fail "credentials: set exactly one of anthropicApiKey or claudeCodeOauthToken, not both" }}
{{- end }}
{{- if not (or .Values.credentials.anthropicApiKey .Values.credentials.claudeCodeOauthToken) }}
{{- fail "credentials: set one of anthropicApiKey or claudeCodeOauthToken" }}
{{- end }}
{{- if not .Values.credentials.githubToken }}
{{- fail "credentials.githubToken is required when credentials.create is true" }}
{{- end }}
{{- if not .Values.credentials.slackBotToken }}
{{- fail "credentials.slackBotToken is required when credentials.create is true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openshell-agent.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /*
    Every key is emitted unconditionally, empty when unset, rather than being
    omitted with `with`. Omitting a key does not remove it from a Secret that
    already has it, so switching from an API key to an OAuth token left both
    present and tripped the launcher's "exactly one" guard — with the stale
    value coming from a credentials file that was no longer even being passed.
    Emitting empties makes the Secret a pure function of the values instead of
    accumulating history. Consumers treat empty as absent.
  */}}
  GITHUB_TOKEN: {{ .Values.credentials.githubToken | default "" | quote }}
  SLACK_BOT_TOKEN: {{ .Values.credentials.slackBotToken | default "" | quote }}
  GRAFANA_SERVICE_ACCOUNT_TOKEN: {{ .Values.credentials.grafanaServiceAccountToken | default "" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.credentials.anthropicApiKey | default "" | quote }}
  CLAUDE_CODE_OAUTH_TOKEN: {{ .Values.credentials.claudeCodeOauthToken | default "" | quote }}
{{- end }}
